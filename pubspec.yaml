name: flag_override_panel
description: >-
  A debug-only panel for viewing and overriding feature flags on-device during
  development and QA, independent of your remote flag provider.
version: 0.1.1
repository: https://github.com/zainulabdn/flag_override_panel
issue_tracker: https://github.com/zainulabdn/flag_override_panel/issues

topics:
  - feature-flags
  - debugging
  - devtools
  - testing

screenshots:
  - description: >-
      The override panel beside the app it drives: flipping a flag on the right
      changes the screen on the left immediately.
    path: doc/showcase.png
  - description: >-
      Toggling flags in the panel and resetting them, with the app updating live.
    path: doc/demo.gif
  - description: >-
      Every registered flag grouped by section, showing the value in effect and
      what it reverts to once the override is cleared.
    path: doc/panel.png
  - description: >-
      In a release build overrides are stored but inert, and the panel says so.
    path: doc/release_build.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
